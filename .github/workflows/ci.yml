name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Provide /etc/lan-discovery (app imports create dirs there)
        run: sudo mkdir -p /etc/lan-discovery && sudo chmod 777 /etc/lan-discovery

      - name: Unit tests
        run: pytest tests/unit -v

      - name: Syntax check (py_compile)
        run: |
          python -m py_compile app.py core/*.py modules/*.py tools/*.py

      - name: Installer 2.0 (bash -n + dry-run §25)
        run: |
          bash -n install.sh
          ./install.sh --dry-run --skip-apt
