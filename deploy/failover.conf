# Конфиг lan_failover.sh (фаза 5). Все значения опциональны — дефолты
# зашиты в скрипте; файл раскомментировать/править при необходимости.
#
# Шлюз LAN и внешний хост для icmp-пробы (обрыв = серия неудач подряд).
#PROBE_GW=192.168.3.1
#PROBE_INET=1.1.1.1
#PROBE_TIMEOUT=8
#
# Имя NM-профиля LTE (nmcli con add type gsm con-name lte ...).
# Без профиля скрипт работает в режиме наблюдения.
#LTE_CON=lte
#
# Серии подряд: неудач до ухода на LTE, успехов до возврата на LAN.
#FAIL_THRESHOLD=3
#OK_THRESHOLD=3
#INTERVAL=10
