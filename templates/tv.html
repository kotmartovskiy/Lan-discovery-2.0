<!doctype html>
<html lang="ru" data-tv>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LAN Discovery — TV</title>
<style>
:root {
  --fs: 28px;            /* базовый кегль (масштабируется) */
  --pad: 5%;             /* safe-поле под overscan CRT */
  --bg: #000;
  --fg: #fff;
  --dim: #c8c8c8;
  --card: #141414;
  --ok: #37d67a;
  --warn: #ffcc33;
  --bad: #ff5555;
  --focus: #ffd24d;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: Arial, Helvetica, "Liberation Sans", sans-serif;
  background: var(--bg);
  color: var(--fg);
  font-size: var(--fs);
  line-height: 1.35;
  padding: var(--pad);
  cursor: none;
  user-select: none;
  overflow: hidden;
}
a { color: inherit; text-decoration: none; }

.header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 2vw;
  margin-bottom: calc(var(--fs) * 0.7);
  flex-wrap: wrap;
}
.clock { font-size: calc(var(--fs) * 2.2); font-weight: 700; letter-spacing: .02em; }
.date  { font-size: var(--fs); color: var(--dim); }
.weather { font-size: calc(var(--fs) * 1.2); font-weight: 700; }

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: calc(var(--fs) * 0.6);
  height: calc(100% - var(--fs) * 5.2);
}
.card {
  background: var(--card);
  border: calc(var(--fs) * 0.12) solid #2a2a2a;
  border-radius: calc(var(--fs) * 0.35);
  padding: calc(var(--fs) * 0.6) calc(var(--fs) * 0.8);
  display: flex;
  flex-direction: column;
  gap: calc(var(--fs) * 0.25);
  overflow: hidden;
}
.card.wide { grid-column: 1 / -1; }
.card h2 {
  font-size: calc(var(--fs) * 0.85);
  color: var(--dim);
  text-transform: uppercase;
  letter-spacing: .05em;
  border-bottom: 2px solid #333;
  padding-bottom: calc(var(--fs) * 0.2);
}
.row { display: flex; justify-content: space-between; align-items: center; gap: 1vw; }
.big { font-size: calc(var(--fs) * 1.4); font-weight: 700; }
.ok { color: var(--ok); }
.warn { color: var(--warn); }
.bad { color: var(--bad); }

.bar {
  height: calc(var(--fs) * 0.7);
  background: #2a2a2a;
  border-radius: calc(var(--fs) * 0.35);
  overflow: hidden;
  flex: 1;
  margin-left: 1vw;
}
.bar > span { display: block; height: 100%; background: var(--ok); }
.bar > span.warn { background: var(--warn); }
.bar > span.bad { background: var(--bad); }

.events { list-style: none; flex: 1; overflow: hidden; }
.events li {
  font-size: calc(var(--fs) * 0.95);
  padding: calc(var(--fs) * 0.12) 0;
  color: var(--dim);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.events li b { color: var(--fg); }

.footer {
  display: flex;
  gap: calc(var(--fs) * 0.5);
  margin-top: calc(var(--fs) * 0.6);
  flex-wrap: wrap;
  align-items: center;
}
.btn {
  display: inline-block;
  background: #222;
  color: var(--fg);
  border: calc(var(--fs) * 0.1) solid #555;
  border-radius: calc(var(--fs) * 0.3);
  padding: calc(var(--fs) * 0.25) calc(var(--fs) * 0.7);
  font-size: calc(var(--fs) * 0.9);
  min-width: calc(var(--fs) * 3);
  text-align: center;
}
.btn:focus, .card:focus { outline: calc(var(--fs) * 0.18) solid var(--focus); outline-offset: 2px; }
.spacer { flex: 1; }
.hint { color: var(--dim); font-size: calc(var(--fs) * 0.75); }

@media (max-width: 900px) {
  .grid { grid-template-columns: 1fr; height: auto; }
  body { overflow: auto; cursor: auto; }
}
</style>
</head>
<body>
<script>var USER_ROLE = "{{ current_user.role if current_user else 'guest' }}";</script>

<div class="header">
  <div>
    <div class="clock" id="clock">--:--:--</div>
    <div class="date" id="date">&nbsp;</div>
  </div>
  <div class="weather" id="weather"></div>
</div>

<div class="grid">
  <section class="card" tabindex="0" data-focus aria-label="Система">
    <h2>🖥 Система</h2>
    <div class="row"><span>CPU</span><div class="bar"><span id="cpu-bar" style="width:0%"></span></div><span class="big" id="cpu">—</span></div>
    <div class="row"><span>RAM</span><div class="bar"><span id="ram-bar" style="width:0%"></span></div><span class="big" id="ram">—</span></div>
    <div class="row"><span>🌡</span><span class="big" id="temp">—</span></div>
    <div class="row"><span>Аптайм</span><span class="big" id="uptime">—</span></div>
  </section>

  <section class="card" tabindex="0" data-focus aria-label="Сеть">
    <h2>📶 Сеть</h2>
    <div class="row"><span>Устройства</span><span class="big" id="devices">—</span></div>
    <div class="row"><span>Интернет</span><span class="big" id="internet">—</span></div>
    <div class="row"><span>Панель</span><span class="big ok">онлайн</span></div>
  </section>

  <section class="card wide" tabindex="0" data-focus aria-label="События">
    <h2>📋 События</h2>
    <ul class="events" id="events"><li>Загрузка…</li></ul>
  </section>
</div>

<div class="footer">
  <a class="btn" href="/" data-focus tabindex="0">✕ В панель</a>
  <span class="hint">Масштаб</span>
  <button class="btn" data-focus tabindex="0" onclick="tvScale(-10)">−</button>
  <span class="hint" id="scale-label">100%</span>
  <button class="btn" data-focus tabindex="0" onclick="tvScale(10)">+</button>
  <span class="hint">Поля</span>
  <button class="btn" data-focus tabindex="0" onclick="tvPad(-1)">−</button>
  <span class="hint" id="pad-label">5%</span>
  <button class="btn" data-focus tabindex="0" onclick="tvPad(1)">+</button>
  <span class="spacer"></span>
  <span class="hint">Пульт: ←→↑↓ · +/− масштаб · 0 сброс · Backspace в панель</span>
</div>

<script>
(function () {
  'use strict';
  var BASE_FS = 28;
  var scale = parseInt(localStorage.getItem('ld_tv_scale') || '100', 10);
  var pad = parseInt(localStorage.getItem('ld_tv_pad') || '5', 10);

  window.tvScale = function (d) {
    scale = Math.min(250, Math.max(60, scale + d));
    localStorage.setItem('ld_tv_scale', String(scale));
    applyVars();
  };
  window.tvPad = function (d) {
    pad = Math.min(12, Math.max(0, pad + d));
    localStorage.setItem('ld_tv_pad', String(pad));
    applyVars();
  };
  function applyVars() {
    document.documentElement.style.setProperty('--fs', (BASE_FS * scale / 100) + 'px');
    document.documentElement.style.setProperty('--pad', pad + '%');
    var sl = document.getElementById('scale-label');
    var pl = document.getElementById('pad-label');
    if (sl) sl.textContent = scale + '%';
    if (pl) pl.textContent = pad + '%';
  }
  applyVars();

  /* --- часы --- */
  var pad2 = function (n) { return (n < 10 ? '0' : '') + n; };
  var MONTHS = ['января','февраля','марта','апреля','мая','июня','июля',
                'августа','сентября','октября','ноября','декабря'];
  var WD = ['вс','пн','вт','ср','чт','пт','сб'];
  function tickClock() {
    var d = new Date();
    document.getElementById('clock').textContent =
      pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds());
    document.getElementById('date').textContent =
      WD[d.getDay()] + ', ' + d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear();
  }
  tickClock();
  setInterval(tickClock, 1000);

  /* --- данные --- */
  function authLost(resp) {
    if (resp.redirected && resp.url && resp.url.indexOf('/login') !== -1) {
      location.href = '/login?next=/tv';
      return true;
    }
    return false;
  }
  function bar(el, pct) {
    el.style.width = Math.max(0, Math.min(100, pct)) + '%';
    el.className = pct >= 90 ? 'bad' : (pct >= 70 ? 'warn' : '');
  }
  function fmtUptime(sec) {
    if (!sec && sec !== 0) return '—';
    var d = Math.floor(sec / 86400), h = Math.floor(sec % 86400 / 3600),
        m = Math.floor(sec % 3600 / 60);
    return (d ? d + ' д ' : '') + h + ' ч ' + m + ' мин';
  }
  var prevCpu = null;
  function cpuPercent(times) {
    if (!times || times.length < 5) return null;
    var idle = times[3] + (times[4] || 0), total = 0;
    for (var i = 0; i < times.length; i++) total += times[i];
    var cur = { idle: idle, total: total };
    if (!prevCpu) { prevCpu = cur; return null; }
    var dt = cur.total - prevCpu.total, di = cur.idle - prevCpu.idle;
    prevCpu = cur;
    if (dt <= 0) return null;
    return Math.round((1 - di / dt) * 100);
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function loadDash() {
    fetch('/api/dashboard', { credentials: 'same-origin' }).then(function (r) {
      if (authLost(r)) throw new Error('auth');
      return r.json();
    }).then(function (d) {
      var s = d.system || {};
      var cpu = cpuPercent(s.cpu_times);
      if (cpu !== null) {
        document.getElementById('cpu').textContent = cpu + '%';
        bar(document.getElementById('cpu-bar'), cpu);
      }
      if (s.ram_percent !== null && s.ram_percent !== undefined) {
        document.getElementById('ram').textContent = s.ram_percent + '%';
        bar(document.getElementById('ram-bar'), s.ram_percent);
      }
      document.getElementById('temp').textContent =
        (s.temperature !== null && s.temperature !== undefined) ? s.temperature + '°C' : '—';
      document.getElementById('uptime').textContent = fmtUptime(s.uptime);
      if (d.devices) {
        document.getElementById('devices').textContent =
          d.devices.online + ' / ' + d.devices.total;
      }
      var inet = document.getElementById('internet');
      if (d.internet === true) { inet.textContent = 'доступен'; inet.className = 'big ok'; }
      else if (d.internet === false) { inet.textContent = 'нет'; inet.className = 'big bad'; }
      else { inet.textContent = '—'; inet.className = 'big'; }
      var ev = document.getElementById('events');
      var list = d.events || [];
      if (!list.length) { ev.innerHTML = '<li>Событий нет</li>'; }
      else {
        ev.innerHTML = list.slice(0, 6).map(function (e) {
          var ts = '';
          if (e.timestamp) {
            var dt = new Date(Number(e.timestamp) * 1000);
            if (!isNaN(dt.getTime())) ts = pad2(dt.getHours()) + ':' + pad2(dt.getMinutes());
          }
          return '<li><b>' + esc(e.event || '') + '</b> — ' +
            esc(e.hostname || e.ip || '') + (ts ? ' · ' + ts : '') + '</li>';
        }).join('');
      }
    }).catch(function () {});
  }
  function loadWeather() {
    fetch('/api/weather-status', { credentials: 'same-origin' }).then(function (r) {
      if (authLost(r)) throw new Error('auth');
      return r.json();
    }).then(function (w) {
      document.getElementById('weather').textContent =
        (w && w.temp !== null && w.temp !== undefined) ? '🌤 ' + w.temp + '°C' : '';
    }).catch(function () {});
  }
  loadDash();
  loadWeather();
  setInterval(loadDash, 20000);
  setInterval(loadWeather, 600000);

  /* --- D-pad навигация --- */
  function items() {
    return Array.prototype.slice.call(document.querySelectorAll('[data-focus]'));
  }
  function move(dx, dy) {
    var list = items();
    if (!list.length) return;
    var cur = document.activeElement;
    if (list.indexOf(cur) === -1) { list[0].focus(); return; }
    var r = cur.getBoundingClientRect();
    var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    var best = null, bestScore = Infinity;
    list.forEach(function (el) {
      if (el === cur) return;
      var b = el.getBoundingClientRect();
      var bx = b.left + b.width / 2, by = b.top + b.height / 2;
      var ddx = bx - cx, ddy = by - cy;
      if (dx && Math.sign(ddx) !== dx) return;
      if (dy && Math.sign(ddy) !== dy) return;
      var along = dx ? Math.abs(ddx) : Math.abs(ddy);
      var across = dx ? Math.abs(ddy) : Math.abs(ddx);
      var score = along + across * 3;
      if (score < bestScore) { bestScore = score; best = el; }
    });
    if (best) best.focus();
  }
  document.addEventListener('keydown', function (e) {
    var k = e.key;
    if (k === 'ArrowLeft')  { move(-1, 0); e.preventDefault(); }
    else if (k === 'ArrowRight') { move(1, 0); e.preventDefault(); }
    else if (k === 'ArrowUp') { move(0, -1); e.preventDefault(); }
    else if (k === 'ArrowDown') { move(0, 1); e.preventDefault(); }
    else if (k === '+' || k === '=') { tvScale(10); e.preventDefault(); }
    else if (k === '-' || k === '_') { tvScale(-10); e.preventDefault(); }
    else if (k === '0') { tvScale(100 - scale); tvPad(5 - pad); e.preventDefault(); }
    else if (k === 'Backspace' || k === 'Escape' || k === 'BrowserBack') {
      location.href = '/';
      e.preventDefault();
    }
  });
})();
</script>
</body>
</html>
